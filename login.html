<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HeartBridge Coaching</title>
</head>
<body>

    <header>
        <h1>HeartBridge Coaching</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="index.html#features">Services</a> |
            <a href="index.html#about">About</a> |
            <a href="contact.html">Contact</a> |
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Login to Your Account</h2>
            <p>Access your coaching sessions, resources, and progress.</p>

            <form action="#" method="post">
                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" required>
                </p>

                <p>
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </p>

                <p>
                    <button type="submit">Login</button>
                </p>
            </form>

            <p><a href="#">Forgot password?</a></p>
            <p>Don’t have an account? <a href="#">Sign up</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HeartBridge Coaching. All rights reserved.</p>
    </footer>

</body>
</html>

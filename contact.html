    <main>
        <section>
            <h2>Contact Me</h2>
            <p>Ready to strengthen your marriage? Reach out and let’s start the conversation.</p>

            <form action="#" method="post">
                <p>
                    <label for="name">Full Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="phone">Phone (optional):</label><br>
                    <input type="tel" id="phone" name="phone">
                </p>

                <p>
                    <label for="message">How can I help you?</label><br>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </p>

                <p>
                    <button type="submit">Send Message</button>
                </p>
            </form>

            <hr>

            <h3>Other Ways to Reach Me</h3>
            <p>Email: coach@heartbridge.com</p>
            <p>Phone: +1 (555) 234-5678</p>
        </section>
    </main>
